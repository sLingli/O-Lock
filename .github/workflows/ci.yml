# 推送到 main / PR 时自动编译并跑单元测试
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # 允许在 Actions 页手动触发

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build OLock-CSharp/OLock.csproj -c Release

      - name: Test
        run: dotnet test OLock-CSharp/OLock.Tests/OLock.Tests.csproj -c Release
